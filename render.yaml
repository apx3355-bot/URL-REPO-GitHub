services:
  - type: web
    name: kelas-x-tkj
    env: docker
    plan: free
    disk:
      name: data-storage
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: /data/database.db
      - key: UPLOAD_PATH
        value: /data/uploads
      - key: BACKUP_PATH
        value: /data/backups
