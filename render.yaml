services:
  - type: web
    name: kelas-x-tkj
    env: node
    plan: free
    buildCommand: npm install && npm --prefix frontend install && npm --prefix frontend run build
    startCommand: npm start
    # Persistent disk: /data bertahan saat restart/redeploy.
    # Catatan: disk Render memerlukan plan berbayar. Selama masih free,
    # data tetap aman lewat auto-backup di backups/ + restore otomatis saat startup.
    disk:
      name: kelas-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: /data/database.db
      - key: UPLOAD_PATH
        value: /data/uploads
      - key: BACKUP_PATH
        value: /data/backups
      - key: SESSION_SECRET
        value: YPK_CLASS_SECRET_2026
